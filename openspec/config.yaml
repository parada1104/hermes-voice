# openspec/config.yaml
schema: spec-driven

context: |
  Hermes Voice: hybrid chat+voice layer over agents (Electron app + Node daemon).
  daemon/: Node.js CommonJS daemon (VAD -> STT(oMLX) -> conversational layer -> TTS(oMLX)),
    WS/REST server on :8471, delegates heavy work to Hermes agent API (:8642, /v1/runs).
  app/: Electron shell + vanilla HTML/JS UI (app/ui) talking to the daemon.
  Source of truth docs: BRIEF.md, IDEA.md, ARCHITECTURE.md, REQUIREMENTS.md (R1..R8).
  Strict TDD is enabled for this project: tests are written before implementation.
  Current roadmap: realtime capture step 1 (silence-based) done; step 2 (incremental STT)
    and step 3 (richer GUI state) are next.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the relevant requirement IDs (R1..R8) from REQUIREMENTS.md when applicable
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows (daemon <-> UI <-> Hermes agent API)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Split daemon/ and app/ changes into separate reviewable units when they diverge
  apply:
    guidelines:
      - Follow existing code patterns (CommonJS in daemon/, vanilla JS in app/ui)
      - Strict TDD: write a failing test first, then implement
    tdd: true
    test_command: "cd daemon && node --test"
  verify:
    test_command: "cd daemon && node --test && cd ../app && node --test ui/lib/*.test.js"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
